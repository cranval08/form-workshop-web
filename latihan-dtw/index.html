<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Workshop</title>
  <!-- Memanggil Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <main class="container py-5" style="max-width: 540px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-4">Registrasi Akun</h1>

        <form id="formDaftar" novalidate>
          <div class="mb-3">
            <label for="nama" class="form-label">Nama lengkap</label>
            <input id="nama" type="text" class="form-control" placeholder="Contoh: Andi Pratama" minlength="3">
            <div id="nama-error" class="invalid-feedback"></div>
          </div>

          
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" type="password" class="form-control" required minlength="8">
            <div id="password-hint" class="form-text">Minimal 8 karakter</div>
            <div id="password-error" class="invalid-feedback"></div>
          </div>

          <div class="mb-3">
            <label for="retype" class="form-label">Re-type password</label>
            <input id="retype" type="password" class="form-control">
            <div id="retype-hint" class="form-text">Ketik ulang password yang sama.</div>
            <div id="retype-error" class="invalid-feedback"></div>
          </div>

          <div class="mb-3">
            <label for="hp" class="form-label">Nomor HP</label>
            <input id="hp" type="text" inputmode="numeric" class="form-control" pattern="08[0-9]{8,11}" placeholder="081234567890">
            <div id="hp-hint" class="form-text">Diawali 08, 10-13 digit</div>
            <div id="hp-error" class="invalid-feedback"></div>
          </div>

          <div class="mb-3">
            <label for="tanggalLahir" class="form-label">Tanggal lahir</label>
            <input id="tanggalLahir" type="date" class="form-control">
            <div id="tanggalLahir-hint" class="form-text">Usia minimal 20 tahun.</div>
            <div id="tanggalLahir-error" class="invalid-feedback"></div>
          </div>

          <button id="tombolKirim" type="submit" class="btn btn-primary w-100">Daftar</button>
          <div id="statusForm"></div>
        </form>
      </div>
    </div>
  </main>
<script src="script.js"></script>
</body>
</html>
